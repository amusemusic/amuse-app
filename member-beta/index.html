<script>/* 회원앱 시험판 — 처음 한 번만: 기존 앱(같은 주소의 member/ 감싸기)에 보관된 이 회원의 로그인 · 홈을 읽어 옴 (기존 값은 읽기만 · 바꾸지 않음)
   - 다시 로그인하지 않게 · 4번째 세션을 만들어 다른 기기 로그인이 밀려나지 않게
   - 홈은 그 토큰의 지문(m)이 맞을 때만 (다른 사람 홈은 절대 가져오지 않음)
   - 시험판에 로그인 값이 이미 있거나 · 한 번 해 봤으면(imported) 하지 않음 */
(function () {
  "use strict";
  var P = "amuseMbBeta:";
  function sessionMark(token) {
  var t = String(token || ""), h1 = 5381, h2 = 52711;
  for (var i = 0; i < t.length; i++) {
  var c = t.charCodeAt(i);
  h1 = ((h1 * 33) ^ c) >>> 0;
  h2 = ((h2 * 31) + c) >>> 0;
  }
  return h1.toString(36) + "." + h2.toString(36);
  }
  try {
    var ls = window.localStorage;
    if (ls.getItem(P + "session") !== null || ls.getItem(P + "imported") !== null) return;
    ls.setItem(P + "imported", "1");
    var s = JSON.parse(ls.getItem("amuseMem:session") || "null");
    if (!s || typeof s !== "object" || !/^[a-f0-9]{64}$/.test(String(s.token || "")) || typeof s.name !== "string") return;
    var exp = Number(s.expiresAt) || 0;
    ls.setItem(P + "session", JSON.stringify({ token: String(s.token), name: s.name.slice(0, 60), expiresAt: exp }));
    var raw = ls.getItem("amuseMem:home");
    var h = null;
    try { h = JSON.parse(raw || "null"); } catch (e) { h = null; }
    if (h && typeof h === "object" && h.m === sessionMark(String(s.token)) && raw.length <= 60000) ls.setItem(P + "home", raw);
  } catch (e) {}
})();</script>
<script>/* 회원앱 시험판 — google.script.run 대신 (데이터만 Apps Script 에 fetch POST · 화면은 이 페이지)
   - Member_JS 는 그대로 google.script.run.withSuccessHandler(…).memberRun(…) 을 부름 → 여기서 POST 로 바꿈
   - 토큰 · 이름 · 코드는 본문(JSON)으로만 · Content-Type text/plain (미리 묻기(preflight) 없음) · 쿠키 · 주소 정보 안 보냄
   - 같은 순간(같은 틱)에 부른 home · feed 읽기는 한 번(boot)으로 묶음 (서버에서는 지금처럼 따로 셈)
   - 쓰기(renew · renewCancel · review · suggest)는 늘 따로 · 다시 보내지 않음 · 시간 제한 없음 (지금과 같음)
   - 전송 오류(구글 오류 화면 · 인터넷 끊김 · 시간 초과)는 실패 처리 → 화면은 "연결이 끊겼어요" · 로그인 · 저장된 홈은 그대로 */
(function () {
  "use strict";
  var EXEC = "https://script.google.com/macros/s/AKfycbwpMbdZk9xuSvp1j0iyS7MQZhkAwPjKdr3dbKLLmFT9iRmrFpF7xDATIzY1vlIbsrd2/exec";
  var P = "amuseMbBeta:";
  var READ_MS = 25000, LOGIN_MS = 40000;
  var BOOT_OPS = { home: 1, feed: 1 };
  var WRITE_OPS = { renew: 1, renewCancel: 1, review: 1, suggest: 1 };
  var TOKEN_RE = /^[a-f0-9]{64}$/;
  var INTRO = "../intro.mp4";
  var q = [], qTimer = 0, gen = 0, reloadArmed = false, moving = false;
  var stat = { posts: 0, boots: 0, runs: 0 };   // 시험용 셈 (개인 자료 없음)

  function lsGet(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { window.localStorage.setItem(k, v); } catch (e) {} }
  function lsDel(k) { try { window.localStorage.removeItem(k); } catch (e) {} }
  function plain(v) { return !!v && typeof v === "object" && !Array.isArray(v); }
  function savedToken() {
    try { var s = JSON.parse(lsGet(P + "session") || "null"); return s && TOKEN_RE.test(String(s.token || "")) ? String(s.token) : ""; } catch (e) { return ""; }
  }
  /** 로그인이 끝났을 때 (AUTH): 이 기기의 내 자료 */
  function wipeMine() {
    ["session", "home", "prog", "help"].forEach(function (k) { lsDel(P + k); });
  }
  /** 로그아웃 · AUTH 로 끝난 토큰이 기존 앱(member/ 감싸기)에도 그대로 있으면 (처음에 가져온 같은 로그인) 그 로그인 · 저장된 홈도 지움
      - 서버에서 이미 끝난 토큰 → 기존 앱이 다음에 열 때 AUTH 로 스스로 지울 것과 같은 일 (로그아웃한 회원의 홈이 휴대폰에 남지 않게)
      - 토큰이 정확히 같을 때만 · 다른 토큰(다른 로그인 · 다른 회원)과 그 밖의 기존 앱 값은 건드리지 않음 */
  var LIVE = "amuseMem:";
  function dropLiveCopy(token) {
    var t = String(token || "");
    if (!TOKEN_RE.test(t)) return;
    try {
      var s = JSON.parse(lsGet(LIVE + "session") || "null");
      if (s && typeof s === "object" && String(s.token || "") === t) { lsDel(LIVE + "session"); lsDel(LIVE + "home"); }
    } catch (e) {}
  }
  /** 시험판 끄기 (MOVED): 시험판이 이 기기에 둔 것 모두 */
  function wipeAll() {
    try {
      var keys = [];
      for (var i = 0; i < window.localStorage.length; i++) { var k = window.localStorage.key(i); if (k && k.indexOf(P) === 0) keys.push(k); }
      keys.forEach(lsDel);
    } catch (e) {}
    lsDel("amuseThemeMbBeta");
    try { if (window.indexedDB) { indexedDB.deleteDatabase("amuseMbBetaMedia"); indexedDB.deleteDatabase("amuseMbBetaIntro"); } } catch (e) {}
    try { if (window.caches) caches.keys().then(function (ks) { ks.forEach(function (k) { if (k.indexOf("amuse-mbeta-shell-") === 0) caches.delete(k); }); }); } catch (e) {}
  }
  function clearQueue() {
    gen++;
    var list = q; q = [];
    clearTimeout(qTimer); qTimer = 0;
    return list;
  }

  /** POST 한 번 → Promise(답 글자) — 실패(인터넷 · 시간 초과 · CORS 없는 구글 화면)는 reject */
  function post(body, ms, keepalive) {
    stat.posts++;
    var ctl = ms && typeof AbortController === "function" ? new AbortController() : null;
    var timer = ctl ? setTimeout(function () { try { ctl.abort(); } catch (e) {} }, ms) : 0;
    var init = {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(body),
      credentials: "omit",
      redirect: "follow",
      cache: "no-store",
      referrerPolicy: "no-referrer",
      mode: "cors"

    if (keepalive) init.keepalive = true;

    try { p = window.fetch(EXEC, init); } catch (e) { p = Promise.reject(e); }
    return p.then(function (res) { return res.text(); }).then(function (t) { clearTimeout(timer); return t; }, function (e) { clearTimeout(timer); throw e; });
  }

  /** 답 글자 → { kind: "ok", obj, text } | { kind: "fail" } (전송 단계 답은 여기서 처리) */
  function classify(text) {
    var obj = null;
    try { obj = JSON.parse(text); } catch (e) { obj = null; }
    if (!plain(obj)) return { kind: "fail" };
    if (typeof obj.amuseApi === "string") {
      if (obj.amuseApi === "UPGRADE") upgrade();
      if (obj.amuseApi === "MOVED") { moved(); return { kind: "moved" }; }
      return { kind: "fail" };
    }
    return { kind: "ok", obj: obj, text: text };
  }
  function netError() { var e = new Error("연결이 끊겼어요. 다시 해 주세요."); e.name = "ScriptError"; return e; }
  function call(fn, arg, uo) { if (typeof fn === "function") { try { fn(arg, uo); } catch (e) { setTimeout(function () { throw e; }, 0); } } }

  function deliver(c, text, obj) {
    if (obj && obj.ok === false && obj.code === "AUTH") dropLiveCopy(c.token);
    if (obj && obj.ok === false && obj.code === "AUTH" && c.token && c.token === savedToken()) {
      wipeMine();
      clearQueue().forEach(function (x) { if (x !== c) call(x.ok, JSON.stringify(obj), x.uo); });
    }
    call(c.ok, text, c.uo);
  }

  function upgrade() {
    if (reloadArmed) return;
    reloadArmed = true;
    try { if (navigator.serviceWorker) navigator.serviceWorker.getRegistration().then(function (r) { if (r) r.update(); }).catch(function () {}); } catch (e) {}
    document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") location.reload(); });
  }
  function moved() {
    if (moving) return;
    moving = true;
    clearQueue();
    wipeAll();
    try {
      var box = document.createElement("div");
      box.textContent = "기존 앱으로 이동합니다";
      box.style.cssText = "position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:2147483646;padding:12px 18px;border-radius:4px;background:#222;color:#fff;font:14px/1.4 sans-serif";
      (document.body || document.documentElement).appendChild(box);
    } catch (e) {}
    setTimeout(function () { location.replace("../member/"); }, 1200);
  }

  /* ---------- 보내기 ---------- */
  function sendRun(c) {
    stat.runs++;
    var write = !!WRITE_OPS[c.op];
    var body = { v: 1, a: "run", token: c.token, op: c.op };
    if (c.payload !== undefined) body.payload = c.payload;
    post(body, write ? 0 : READ_MS, false).then(function (text) {
      var r = classify(text);
      if (r.kind === "moved") return;
      if (r.kind !== "ok") { call(c.fail, netError(), c.uo); return; }
      deliver(c, text, r.obj);
    }, function () { call(c.fail, netError(), c.uo); });
  }
  function sendBoot(list) {
    stat.boots++;
    var body = { v: 1, a: "boot", token: list[0].token, ops: list.map(function (c) { var o = { op: c.op }; if (c.payload !== undefined) o.payload = c.payload; return o; }) };
    post(body, READ_MS, false).then(function (text) {
      var r = classify(text);
      if (r.kind === "moved") return;
      var arr = r.kind === "ok" && r.obj.ok === true && Array.isArray(r.obj.r) && r.obj.r.length === list.length ? r.obj.r : null;
      if (!arr) { list.forEach(function (c) { call(c.fail, netError(), c.uo); }); return; }
      list.forEach(function (c, i) {
        var o = arr[i];
        if (!plain(o) || typeof o.amuseApi === "string") { call(c.fail, netError(), c.uo); return; }
        deliver(c, JSON.stringify(o), o);
      });
    }, function () { list.forEach(function (c) { call(c.fail, netError(), c.uo); }); });
  }
  function flush() {
    qTimer = 0;
    var list = q; q = [];
    var byTok = {}, order = [];
    list.forEach(function (c) { if (!byTok[c.token]) { byTok[c.token] = []; order.push(c.token); } byTok[c.token].push(c); });
    order.forEach(function (t) {
      var group = byTok[t], boot = [], rest = [], have = {};
      group.forEach(function (c) { if (boot.length < 2 && !have[c.op]) { have[c.op] = 1; boot.push(c); } else rest.push(c); });
      if (boot.length === 2) sendBoot(boot); else boot.forEach(sendRun);
      rest.forEach(sendRun);
    });
  }
  function memberRun(c) {
    if (moving) return;
    var readBoot = BOOT_OPS[c.op] && (c.payload === undefined || plain(c.payload)) && typeof c.token === "string";
    if (readBoot) {
      q.push(c);
      if (!qTimer) qTimer = setTimeout(flush, 0);
      return;
    }
    sendRun(c);
  }
  function memberLogin(c) {
    if (moving) return;
    post({ v: 1, a: "login", name: c.args[0], code: c.args[1] }, LOGIN_MS, false).then(function (text) {
      var r = classify(text);
      if (r.kind === "moved") return;
      if (r.kind !== "ok") { call(c.fail, netError(), c.uo); return; }
      call(c.ok, text, c.uo);
    }, function () { call(c.fail, netError(), c.uo); });
  }
  function memberLogout(c) {
    clearQueue();
    dropLiveCopy(c.args[0]);
    post({ v: 1, a: "logout", token: c.args[0] }, 0, true).then(function (text) {
      var r = classify(text);
      if (r.kind === "ok") call(c.ok, text, c.uo); else if (r.kind === "fail") call(c.fail, netError(), c.uo);
    }, function () { call(c.fail, netError(), c.uo); });
  }

  /* ---------- 인트로 영상: Apps Script 를 부르지 않음 (서비스 워커 저장본 → 없으면 인터넷 1.5초까지) ---------- */
  function b64(buf) {
    var u8 = new Uint8Array(buf), bin = "", CH = 32768;
    for (var i = 0; i < u8.length; i += CH) bin += String.fromCharCode.apply(null, u8.subarray(i, i + CH));

    var done = false, netOn = false;
    var give = function (buf) { if (done) return; done = true; var s = ""; try { s = b64(buf); } catch (e) { s = ""; } if (s) call(c.ok, s, c.uo); else call(c.fail, netError(), c.uo); };
    var no = function () { if (done) return; done = true; call(c.fail, netError(), c.uo); };
    var net = function () {
      if (done || netOn) return;
      netOn = true;
      var ctl = typeof AbortController === "function" ? new AbortController() : null;
      var t = setTimeout(function () { try { if (ctl) ctl.abort(); } catch (e) {} no(); }, 1500);

        fetch(INTRO, ctl ? { credentials: "same-origin", signal: ctl.signal } : { credentials: "same-origin" })
          .then(function (r) { return r && r.ok ? r.arrayBuffer() : null; })
          .then(function (buf) { clearTimeout(t); if (buf && buf.byteLength) give(buf); else no(); }, function () { clearTimeout(t); no(); });
      } catch (e) { clearTimeout(t); no(); }
    };
    var t1 = setTimeout(net, 400);
    try {
      if (!window.caches) { clearTimeout(t1); net(); return; }
      caches.match(INTRO).then(function (r) { return r && r.ok ? r.arrayBuffer() : null; }).then(function (buf) {
        if (netOn || done) return;
        clearTimeout(t1);
        if (buf && buf.byteLength) give(buf); else net();
      }, function () { if (!netOn) { clearTimeout(t1); net(); } });
    } catch (e) { clearTimeout(t1); net(); }
  }

  /* ---------- google.script.run (바뀌지 않는 runner — with… 마다 새 runner) ---------- */
  function runner(ok, fail, uo) {
    var make = function (name, fn) {
      return function () {
        var args = Array.prototype.slice.call(arguments);
        var c = { ok: ok, fail: fail, uo: uo, args: args };
        if (name === "memberRun") {
          c.token = typeof args[0] === "string" ? args[0] : String(args[0]);
          c.op = String(args[1] === undefined || args[1] === null ? "" : args[1]);
          c.payload = args[2] === undefined ? undefined : JSON.parse(JSON.stringify(args[2]));

        fn(c);
      };
    };
    return Object.freeze({
      withSuccessHandler: function (f) { return runner(f, fail, uo); },
      withFailureHandler: function (f) { return runner(ok, f, uo); },
      withUserObject: function (o) { return runner(ok, fail, o); },
      memberLogin: make("memberLogin", memberLogin),
      memberRun: make("memberRun", memberRun),
      memberLogout: make("memberLogout", memberLogout),
      getTeacherIntroVideo: make("getTeacherIntroVideo", introVideo)
    });
  }
  window.google = { script: { run: runner(null, null, undefined) } };
  window.AmuseBeta = { stat: stat, exec: EXEC };

  /* ---------- 로그인 아래 안내 한 줄 (공개 글 · 저장본 → 로그인 화면이 보일 때 한 번 새로) ---------- */
  var helpAsked = false;
  function helpEl() { return document.getElementById("loginHelp"); }
  function applyHelp(t) { var el = helpEl(); if (el && typeof t === "string" && t) el.textContent = t; }
  function askHelp() {
    if (helpAsked) return;
    var box = document.getElementById("loginScreen");
    if (!box || box.hidden) return;
    helpAsked = true;
    post({ v: 1, a: "help" }, READ_MS, false).then(function (text) {
      var r = classify(text);
      if (r.kind === "ok" && r.obj.ok === true && typeof r.obj.help === "string" && r.obj.help.length <= 500) { applyHelp(r.obj.help); lsSet(P + "help", r.obj.help); }
    }, function () {});
  }
  function watchLogin() {
    var cached = lsGet(P + "help");
    if (cached && cached.length <= 500) applyHelp(cached);
    var box = document.getElementById("loginScreen");
    if (!box) return;
    askHelp();
    if (typeof MutationObserver === "function") {
      var mo = new MutationObserver(function () { askHelp(); if (helpAsked) mo.disconnect(); });
      mo.observe(box, { attributes: true, attributeFilter: ["hidden"] });
    }
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", watchLogin); else watchLogin();

  /* ---------- 서비스 워커 (껍데기 · 아이콘 · 인트로 영상만 저장) ---------- */
  function registerSw() {
    try {

  } catch (e) {}
})();</script>

<script>var MBIntro = (function () {
var VIDEO_W = 2160, VIDEO_H = 3840;
var LOGO_BOX = { x: 0.315, y: 0.4625, w: 0.378, h: 0.123 };
var LOGO_DONE = 1.75;
var finished = false;
var waitMore = 0;
function el(id) { return document.getElementById(id); }
function targetLogo() {
if (!el("loginScreen").hidden) return document.querySelector("#loginScreen .logo-full");
if (!el("appScreen").hidden) return document.querySelector("#topbar img, #topbar svg");
return null;
}
function videoLogoRect(video) {
var r = video.getBoundingClientRect();
var scale = Math.max(r.width / VIDEO_W, r.height / VIDEO_H);
var w = VIDEO_W * scale, h = VIDEO_H * scale;
var left = r.left + (r.width - w) / 2, top = r.top + (r.height - h) / 2;
return { left: left + LOGO_BOX.x * w, top: top + LOGO_BOX.y * h, width: LOGO_BOX.w * w, height: LOGO_BOX.h * h };
}
function contentBox(img) {
try {
if (!img.naturalWidth) return { x: 0, y: 0, w: 1, h: 1 };
var W = 240, H = Math.round(240 * img.naturalHeight / img.naturalWidth);
var c = document.createElement("canvas");
c.width = W; c.height = H;
var ctx = c.getContext("2d");
ctx.drawImage(img, 0, 0, W, H);
var d = ctx.getImageData(0, 0, W, H).data;
var minX = W, minY = H, maxX = 0, maxY = 0, whiteTop = H;
for (var y = 0; y < H; y++) for (var x = 0; x < W; x++) {
var k = (y * W + x) * 4;
if (d[k + 3] > 40) {
if (x < minX) minX = x; if (x > maxX) maxX = x;
if (y < minY) minY = y; if (y > maxY) maxY = y;
if (d[k + 3] > 200 && d[k] > 200 && d[k + 1] > 200 && d[k + 2] > 200 && y < whiteTop) whiteTop = y;
}
}
if (maxX <= minX) return { x: 0, y: 0, w: 1, h: 1, tag: 1 };
return { x: minX / W, y: minY / H, w: (maxX - minX + 1) / W, h: (maxY - minY + 1) / H, tag: Math.max(0, (whiteTop - 2) / H) };
} catch (e) {
return { x: 0, y: 0, w: 1, h: 1, tag: 1 };
}
}
function finish() {
if (finished) return;
finished = true;
var intro = el("intro");
var video = el("introVideo");
if (!intro) return;
var tries = 0;
(function waitTarget() {
var target = targetLogo();
if (!target && tries++ < 40 + waitMore) return setTimeout(waitTarget, 75);
if (!target || !target.getBoundingClientRect().width) { intro.classList.add("intro-out"); setTimeout(function () { intro.remove(); }, 500); return; }
animateTo(target, intro, video);
})();
}
function animateTo(target, intro, video, fromRect, onPlaced) {
var from = fromRect || videoLogoRect(video);
var to = target.getBoundingClientRect();
var login = !el("loginScreen").hidden;
if (login) document.body.classList.add("intro-login");
var clone = target.cloneNode(true);
clone.removeAttribute("id");
clone.className = (clone.className && clone.className.baseVal === undefined ? clone.className + " " : "") + "intro-logo";
var cb = contentBox(target);
var width = from.width / cb.w;
var height = to.height * (width / to.width);
var left = from.left - cb.x * width;
var top = from.top - cb.y * height;
clone.style.cssText =
"position:fixed;z-index:1001;margin:0;opacity:0;" +
"left:" + left + "px;" +
"top:" + top + "px;" +
"width:" + width + "px;height:" + height + "px;" +
"transform-origin:0 0;transition:transform .8s cubic-bezier(.65,0,.25,1), clip-path .7s ease .1s, -webkit-clip-path .7s ease .1s;";
var hideTag = "inset(0 0 " + ((1 - cb.tag) * 100).toFixed(2) + "% 0)";
clone.style.clipPath = hideTag;
clone.style.webkitClipPath = hideTag;
document.body.appendChild(clone);
target.style.visibility = "hidden";
clone.style.opacity = "1";
requestAnimationFrame(function () {
if (onPlaced) { try { onPlaced(); } catch (e) {} }
intro.classList.add("intro-fade");
setTimeout(function () {
var startLeft = parseFloat(clone.style.left), startTop = parseFloat(clone.style.top);
var s = to.width / width;
clone.style.transform = "translate(" + (to.left - startLeft) + "px," + (to.top - startTop) + "px) scale(" + s + ")";
clone.style.clipPath = "inset(0 0 0 0)";
clone.style.webkitClipPath = "inset(0 0 0 0)";
intro.classList.add("intro-out");
}, 120);
setTimeout(function () {
target.style.visibility = "";
clone.remove();
intro.remove();
document.body.classList.remove("intro-login");
document.body.classList.add("intro-done");
}, 950);
});
}
var VIDEO_KEY = "intro-v1";
function idb() {
return new Promise(function (resolve, reject) {
try {
var req = indexedDB.open("amuseMbBetaIntro", 1);
req.onupgradeneeded = function () { req.result.createObjectStore("files"); };
req.onsuccess = function () { resolve(req.result); };
req.onerror = function () { reject(req.error); };
} catch (e) { reject(e); }
});
}
function storedVideo() {
return idb().then(function (db) {
return new Promise(function (resolve) {
var q = db.transaction("files", "readonly").objectStore("files").get(VIDEO_KEY);
q.onsuccess = function () { resolve(q.result || null); };
q.onerror = function () { resolve(null); };
});
}).catch(function () { return null; });
}
function storeVideo(buffer) {
return idb().then(function (db) {
return new Promise(function (resolve) {
var tx = db.transaction("files", "readwrite");
tx.objectStore("files").put(buffer, VIDEO_KEY);
tx.oncomplete = function () { resolve(true); };
tx.onerror = function () { resolve(false); };
});
}).catch(function () { return false; });
}
