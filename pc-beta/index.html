<script>var Toast = {
defaultDuration: 3000,
icons: {
success: "✓",
error: "!",
warning: "!",
info: "i"
},
titles: {
success: "완료",
error: "오류",
warning: "확인 필요",
info: "안내"
},
show: function (type, message, options) {
const settings = options || {};
const container = document.getElementById(
"amuseToastContainer"
);
if (!container) {
console.error("Toast 컨테이너를 찾을 수 없습니다.");
return null;
}
const toastType = this.icons[type] ? type : "info";
const duration =
typeof settings.duration === "number"
? settings.duration
: this.defaultDuration;
const toast = document.createElement("div");
toast.className =
"amuse-toast amuse-toast-" + toastType;
toast.setAttribute("role", "status");
const icon = document.createElement("div");
icon.className = "amuse-toast-icon";
icon.textContent = this.icons[toastType];
const content = document.createElement("div");
content.className = "amuse-toast-content";
const title = document.createElement("p");
title.className = "amuse-toast-title";
title.textContent =
settings.title || this.titles[toastType];
const messageElement = document.createElement("p");
messageElement.className = "amuse-toast-message";
messageElement.textContent = String(message || "");
const closeButton = document.createElement("button");
closeButton.type = "button";
closeButton.className = "amuse-toast-close";
closeButton.setAttribute("aria-label", "알림 닫기");
closeButton.textContent = "×";
content.appendChild(title);
if (message) {
content.appendChild(messageElement);
}
toast.appendChild(icon);
toast.appendChild(content);
toast.appendChild(closeButton);
container.appendChild(toast);
requestAnimationFrame(function () {
toast.classList.add("is-visible");
});
const removeToast = function () {
if (!toast.isConnected) {
return;
}
toast.classList.remove("is-visible");
toast.classList.add("is-leaving");
setTimeout(function () {
toast.remove();
}, 230);
};
closeButton.addEventListener("click", removeToast);
if (duration > 0) {
setTimeout(removeToast, duration);
}
return toast;
},
success: function (message, options) {
return this.show("success", message, options);
},
error: function (message, options) {
return this.show("error", message, options);
},
warning: function (message, options) {
return this.show("warning", message, options);
},
info: function (message, options) {
return this.show("info", message, options);
}
};</script>
