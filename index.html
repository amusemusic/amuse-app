<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>AMUSE 강사</title>
<meta name="description" content="AMUSE 강사 앱">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- black-translucent: 상태 표시줄 아래까지 이 페이지가 직접 칠함 → iOS가 그리는 띠·경계선이 없음 -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AMUSE 강사">
<meta name="application-name" content="AMUSE 강사">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<!-- 빨리 열기: 앱(구글) · 글꼴 서버와 미리 연결해 둠 (앱 화면을 받는 동안 연결 준비가 겹침) -->
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<script>
  // 지난번에 앱 화면을 보내 준 구글 틀 주소(…-script.googleusercontent.com)에도 미리 연결 — 처음 여는 날은 없음
  (function () {
    try {
      var o = localStorage.getItem('amuseWrap.sbx');
      if (!o || !/^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/.test(o)) return;
      var l = document.createElement('link');
      l.rel = 'preconnect';
      l.href = o;
      document.head.appendChild(l);
    } catch (e) {}
  })();
</script>
<style>
  /* 화면 가장자리 색 (위 절반 · 아래 절반) — 앱이 {amuse:'chrome'} 으로 지금 화면에 맞는 색을 알려 줌
     (아이폰 홈 화면 앱에서 앱 틀이 화면 맨 아래 · 맨 위에 못 닿을 때 남는 띠가 이 색 → 인트로는 검정 · 메인은 아래 흰 탭바와 같은 흰색)
     기본(로딩 · 인트로)은 검정 #000 */
  :root { --fill-top: #000000; --fill-bot: #000000; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }
  /* 문서 바탕은 화면 전체(문서 높이 밖 · 아이폰이 남기는 띠까지)를 칠함: 위 절반 = --fill-top, 그 밖 전부 = --fill-bot */
  html { background: linear-gradient(var(--fill-top), var(--fill-top)) 0 0 / 100% 50% no-repeat, var(--fill-bot); }
  body { background: transparent; }

  /* 앱 화면. 기본은 안전 영역(노치 · 홈 막대) 안쪽에, 바깥은 가장자리 색.
     앱이 인사(postMessage)를 보내오면 html.edge → 화면 끝까지 채우고, 안전 영역 값은 앱에 넘겨줌
     --full-h: 아이폰 홈 화면 앱에서 창 높이(innerHeight)가 실제 화면보다 짧게 잡힐 때 실제 화면 높이 (아래 fit()) */
  #app {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: 0;
    margin: 0;
    padding: 0;
    display: block;
    background: transparent;
  }
  html.edge #app { height: var(--full-h, 100%); }
  /* iframe 은 inset 만으로는 늘어나지 않으므로(300×150) 너비 · 높이를 직접 계산 */
  html:not(.edge) #app {
    top: env(safe-area-inset-top, 0px);
    left: env(safe-area-inset-left, 0px);
    width: calc(100% - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
    height: calc(100% - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  }

  /* 여는 동안: 검정 화면 (그날 처음이면 인트로 영상) — 두근거리는 로고는 없음 */
  #cover {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: var(--full-h, 100%);
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    color: #cfcfcf;
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    text-align: center;
    opacity: 1;
    transition: opacity .35s ease, visibility 0s linear .35s;
  }
  #cover.gone { opacity: 0; visibility: hidden; pointer-events: none; }
  /* 로고 넘겨주기: 앱이 같은 자리에 로고를 올려 둔 뒤 영상만 빠르게 사라짐 (앱 인트로의 영상 사라짐과 같은 0.25초) */
  #cover.fast { transition: opacity .25s ease, visibility 0s linear .25s; }
  /* 인트로 영상 — 강사앱(TeacherApp_Intro · TeacherApp_CSS .intro)과 같은 모양: 화면 가득(cover) · 로고 주황 보정 */
  #introVideo {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: url(#introTint);
    opacity: 0;
    pointer-events: none;
  }
  #introVideo.on { opacity: 1; }
  /* 노트북 · 큰 화면(마우스): 가운데 좁은 세로 상자(최대 420px) — 앱 인트로와 같은 규칙 */
  @media (min-width: 768px) and (hover: hover) {
    #introVideo { width: min(40vw, 420px); }
  }
  #fail { position: absolute; left: 16px; right: 16px; top: 50%; transform: translateY(-50%); }
  #fail p { margin: 0 0 18px; }
  #fail .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  #fail button, #fail a {
    font: inherit;
    font-weight: 700;
    height: 44px;
    padding: 0 18px;
    border-radius: 4px;
    display: inline-flex;
    align-items: center;
    text-decoration: none;
    cursor: pointer;
  }
  #fail button { border: 0; background: #e95a1a; color: #fff; }
  #fail a { border: 1px solid #3a3a3a; background: #1a1a1a; color: #fff; }
  /* ?debug=1 일 때만: 화면 크기 · 안전 영역 값 (원장님이 캡처해서 보내 주실 수 있게) */
  #debug {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 4px);
    left: 4px;
    z-index: 9;
    max-width: calc(100% - 8px);
    margin: 0;
    padding: 6px 8px;
    border-radius: 4px;
    background: rgba(0, 0, 0, .78);
    color: #7CFC9A;
    font: 10px/1.35 ui-monospace, Menlo, Consolas, monospace;
    white-space: pre-wrap;
    word-break: break-all;
    pointer-events: none;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<iframe id="app" title="AMUSE 강사" allow="clipboard-write; autoplay"></iframe>

<div id="cover" role="status" aria-live="polite">
  <!-- 영상 속 로고 주황(208,60,20)을 학원 주황 #E95A1A 로 (검정 · 흰색은 그대로) — TeacherApp_Intro 와 같은 값 -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="introTint" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="1.1427 -0.0459 -0.0969 0 0 0.1713 0.9449 -0.1162 0 0 0.0343 -0.0110 0.9768 0 0 0 0 0 1 0"/></filter></svg>
  <video id="introVideo" muted playsinline webkit-playsinline preload="none" disablepictureinpicture disableremoteplayback aria-hidden="true"></video>
  <div id="fail" hidden>
    <p id="failMsg">앱을 불러오지 못했어요.</p>
    <div class="row">
      <button id="retry" type="button">다시 시도</button>
      <a id="direct" href="#" target="_blank" rel="noopener">앱 바로 열기</a>
    </div>
  </div>
  <noscript><p>자바스크립트를 켜야 앱이 열립니다.</p></noscript>
</div>

<script>
/*
 * AMUSE 강사 — 앱 감싸기 (GitHub Pages)
 * 구글 Apps Script 웹앱을 화면 가득 iframe 으로 띄웁니다.
 *
 * 여는 순서 (v2)
 *   - 처음부터 검정 화면. 그날 처음 열면 인트로 영상(intro.mp4 — 이 폴더)을 바로 틀고, 그동안 뒤에서 구글 앱을 불러옴 (기다리는 시간이 영상과 겹침)
 *   - 로고가 다 그려지면(1.75초 — 그 뒤 영상 끝 3.6초까지는 같은 장면) 거기서 멈춤: 앱이 아직이면 그 로고 그대로 기다림 ·
 *     앱이 먼저 준비되면 로고가 다 그려질 때까지 기다림 (영상은 늘 끝까지 그려진 로고까지 나옴 — 누르면 건너뛰기 아님)
 *   - 영상은 서비스 워커가 통째로 저장해 둔 것을 씀(blob) — 없으면 인터넷에서
 *   - 둘 다 끝나면: 새 앱은 로고를 넘겨받아 로그인 · 상단 로고 자리로 옮김(앱 인트로와 같은 움직임) · 예전 앱은 그냥 걷음
 *   - 영상을 못 틀면(저전력 모드 · 느린 인터넷) 검정 화면 그대로. 누르면 건너뛰기는 없음
 *   - 인트로는 감싸기가 맡는다고 앱이 알려 준 적이 있을 때만(amuseWrap.appIntro) — 처음 한 번 · 예전 앱은 앱이 하던 대로 앱이 틂
 *
 * 앱 쪽(Apps Script)과 주고받는 메시지 (모두 선택 사항 — 없어도 동작):
 *   앱 → 감싸기  {amuse:'hello', v, caps:[...]}  감싸기가 답: {amuse:'wrapper', v, insets:{top,right,bottom,left}, standalone, store:{...}
 *                                                   (+ caps 에 'intro' 가 있으면 intro:'wrapper', introPlaying)}
 *                                                   (답을 받으면 감싸기는 화면 끝까지 채움 → 앱이 insets 로 직접 여백 처리)
 *                                                   insets 는 앱 틀 기준 (틀이 화면 끝에 못 닿은 만큼 뺀 값)
 *   앱 → 감싸기  {amuse:'ready'}                 첫 화면을 그렸음 (영상이 끝났으면 바로 걷음)
 *   감싸기 → 앱  {amuse:'handoff', logo}         (v2 · intro) 걷기 직전: 영상 마지막 장면 로고 자리 {left,top,width,height} (앱 틀 기준 px) · 영상을 못 틀었으면 null
 *   앱 → 감싸기  {amuse:'handoff'}               (v2) 같은 자리에 로고를 올려 둠 → 감싸기가 영상을 빠르게 걷음
 *   앱 → 감싸기  {amuse:'chrome', top, bottom}   (v2) 화면 위 · 아래 가장자리 색 (#rrggbb) — 인트로 #000 · 로그인 #111 · 메인 아래 #fff ...
 *   앱 → 감싸기  {amuse:'set', key, value}       감싸기 쪽(1st-party) 저장소에 보관 (value 가 null 이면 지움)
 *   감싸기 → 앱  {amuse:'insets', insets}        화면 돌림 · 크기 바뀔 때
 *   감싸기 → 앱  {amuse:'vv', h, top}            이 페이지의 보이는 높이 · 위 위치 (visualViewport — 키보드가 올라오면 줄어듦)
 *                                                   아이폰은 키보드가 이 페이지의 보이는 부분만 줄이고 iframe 안에는 알리지 않음 → 앱 로그인 화면이 이 값으로 맞춤
 * 앱은 window.top.postMessage(msg, '<이 페이지의 origin>') 으로 보냅니다 (대상 origin 을 꼭 지정).
 *
 * index.html?debug=1 → 화면 왼쪽 위에 크기 · 안전 영역 값 (문제가 있을 때 캡처용)
 */
(function () {
  'use strict';

  var APP_URL = 'https://script.google.com/macros/s/AKfycbw1-I-KqG_h6MxDZRTI_wpmjphIUTiZnzNDlD84AZXInsvf931docQOK1kbZ3j9TCvB/exec';
  var FRAME_URL = APP_URL + '?wrap=1';          // Apps Script 는 이 표시가 있을 때만 iframe 허용(ALLOWALL)
  var SANDBOX_ORIGIN = /^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/;
  var WAIT_MS = 20000;                          // 이 시간 안에 못 열리면 안내
  var STORE_PREFIX = 'amuse:';
  var VERSION = 2;

  // 인트로 영상 (TeacherApp_IntroVideo 와 같은 파일) — 영상 속 로고 자리는 TeacherApp_JS(TAIntro) 와 같은 값
  var INTRO_SRC = 'intro.mp4';
  var INTRO_W = 2160, INTRO_H = 3840;
  var INTRO_LOGO = { x: 0.315, y: 0.4625, w: 0.378, h: 0.123 };
  var INTRO_LOGO_DONE = 1.75;                   // (초) 영상 속 로고가 다 그려진 때 (1.67초부터 끝 3.63초까지 같은 장면 — 측정 2026-10-29)
  var INTRO_LOAD_MS = 8000;                     // 이 안에 재생이 시작되지 않으면 검정 화면으로
  var INTRO_MAX_MS = 9000;                      // 재생이 멈춰 끝나지 않을 때 안전장치
  var KEY_APP_INTRO = 'amuseWrap.appIntro';     // 앱이 "인트로는 감싸기가" 를 알아들음 (앞에 amuse: 가 아니라 앱에 넘기는 보관 값과 섞이지 않음)
  var KEY_INTRO_DATE = 'amuseWrap.introDate';   // 오늘 인트로를 이미 봤음 (하루 한 번 — 앱과 같은 규칙)
  var KEY_SANDBOX = 'amuseWrap.sbx';            // 앱 화면을 보내 준 구글 틀 origin (다음에 열 때 미리 연결 — 위 <head>)
  var HEX = /^#[0-9a-fA-F]{6}$/;
  // ?debug=1 은 이 기기에 기억 (홈 화면 앱은 주소 뒤 ?debug=1 을 버림) · ?debug=0 으로 끔
  var DEBUG = false;
  try {
    if (/(?:^|[?&])debug=1(?:&|$)/.test(location.search)) localStorage.setItem('amuseDebug', '1');
    else if (/(?:^|[?&])debug=0(?:&|$)/.test(location.search)) localStorage.removeItem('amuseDebug');
    DEBUG = localStorage.getItem('amuseDebug') === '1';
  } catch (e) { DEBUG = /(?:^|[?&])debug=1(?:&|$)/.test(location.search); }

  var root = document.documentElement;
  var frame = document.getElementById('app');
  var cover = document.getElementById('cover');
  var video = document.getElementById('introVideo');
  var fail = document.getElementById('fail');
  var failMsg = document.getElementById('failMsg');
  var direct = document.getElementById('direct');
  direct.href = APP_URL;
  document.getElementById('retry').addEventListener('click', function () { location.reload(); });

  var standalone = !!(window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  var iosStandalone = navigator.standalone === true;   // 아이폰 · 아이패드 홈 화면 앱에만 있는 값

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
  function today() { var d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }

  var revealed = false, failed = false, failTimer = 0, pollTimer = 0;
  var loaded = false, appReady = false, readyTimer = 0;
  var handing = false, handTimer = 0;
  var app = { hello: false, v: 0, intro: false, chrome: false };
  var fillApp = null;                           // 앱이 알려 준 가장자리 색 {top, bottom}

  // ---------- 가장자리 색 ----------
  function setFill(top, bottom) {
    root.style.setProperty('--fill-top', top);
    root.style.setProperty('--fill-bot', bottom);
  }
  // 걷은 뒤: 앱이 알려 준 색 (예전 앱은 알려 주지 않음 → 예전 바탕 #111)
  function appFill() {
    if (fillApp) setFill(fillApp.top, fillApp.bottom);
    else setFill('#111111', '#111111');
  }

  // ---------- 화면 높이 (아이폰 홈 화면 앱) ----------
  // 아이폰 홈 화면 앱(black-translucent)에서 창 높이(innerHeight · 100%)가 실제 화면보다 짧게 잡히는 경우가 있음
  //  → 앱 틀이 화면 끝에 못 닿고 그 아래에 다른 색 띠가 남음. 실제 화면 높이(100lvh · screen)를 재서 틀을 그만큼 늘림.
  //  그래도 못 칠하는 곳은 가장자리 색이 같은 색으로 메움. 홈 화면 앱이 아니면(사파리 탭 · 안드로이드) 늘리지 않음.
  // 기기 안전 영역 (노치 · 홈 막대)
  var probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;pointer-events:none;' +
    'padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)';
  document.body.appendChild(probe);
  function envInsets() {
    var cs = getComputedStyle(probe);
    return {
      top: parseFloat(cs.paddingTop) || 0, right: parseFloat(cs.paddingRight) || 0,
      bottom: parseFloat(cs.paddingBottom) || 0, left: parseFloat(cs.paddingLeft) || 0
    };
  }
  var hProbe = document.createElement('div');
  hProbe.style.cssText = 'position:fixed;top:0;left:0;width:0;visibility:hidden;pointer-events:none;height:100vh;height:100lvh';
  document.body.appendChild(hProbe);
  var view = { base: 0, full: 0, lvh: 0, screen: 0 };
  function fit() {
    var ih = window.innerHeight || 0, iw = window.innerWidth || 0;
    var base = Math.max(ih, root.clientHeight || 0);
    var lvh = hProbe.getBoundingClientRect().height || 0;
    var sh = 0;
    if (iosStandalone && window.screen) {
      var a = screen.width || 0, b = screen.height || 0;
      var lo = Math.min(a, b), hi = Math.max(a, b), land = iw > ih;
      // 창이 화면 너비 전체일 때만 (아이패드 나눠 보기 등은 제외)
      if (Math.abs((land ? hi : lo) - iw) <= 2) sh = land ? lo : hi;
    }
    // 늘리기는 끔: 실제 아이폰에서 틀이 화면 밖으로 밀려 탭 글자가 가려짐 (2026-10-29) → 틀은 창 높이 그대로, 모자란 띠는 가장자리 색이 메움
    var full = base;
    if (full - base > 150) full = base;          // 너무 크게 차이 나면(키보드 등) 늘리지 않음
    // 상태 막대 아래까지 그려지는 상태(black-translucent → 위 안전 영역 > 0)일 때만 늘리고, 늘려도 홈 막대 높이(34)쯤까지만
    //  (상태 막대 아래에서 시작하는 창이면 모자란 높이가 위쪽이라 늘리면 탭바가 화면 밖으로 잘림)
    //  창이 짧을 때 iOS 가 아래 안전 영역을 0 으로 줄 수도 있어 최소 40 은 허용
    var e = envInsets();
    if (!(e.top > 0)) full = base;
    else full = Math.min(full, base + Math.max(e.bottom, 40));
    view = { base: base, full: full, lvh: lvh, screen: sh };
    if (full > base + 0.5) root.style.setProperty('--full-h', full + 'px');
    else root.style.removeProperty('--full-h');
  }
  fit();

  // ---------- 걷기 · 실패 ----------
  function reveal(fast) {
    if (revealed) return;
    revealed = true;
    handing = false;
    clearTimeout(failTimer); clearInterval(pollTimer); clearTimeout(readyTimer); clearTimeout(handTimer);
    fail.hidden = true;
    cover.classList.remove('failed');
    if (fast) cover.classList.add('fast');
    cover.classList.add('gone');
    appFill();
    // 다 사라진 뒤 영상은 내려놓음 (메모리)
    setTimeout(function () {
      stopIntro();
      try { video.removeAttribute('src'); video.load(); } catch (e) {}
      if (intro.blobUrl) { try { URL.revokeObjectURL(intro.blobUrl); } catch (e) {} intro.blobUrl = ''; }
    }, 600);
  }
  function showFail() {
    if (revealed || failed) return;
    failed = true;
    clearInterval(pollTimer); clearTimeout(readyTimer); clearTimeout(handTimer);
    stopIntro();
    video.classList.remove('on');               // 안내 글이 영상 로고와 겹치지 않게 검정으로
    if (intro.state !== 'off') intro.state = 'failed';
    failMsg.innerHTML = navigator.onLine === false
      ? '인터넷에 연결되어 있지 않아요.<br>연결을 확인한 뒤 다시 시도해 주세요.'
      : '앱을 불러오지 못했어요.<br>잠시 뒤 다시 시도하거나, 앱을 바로 열어 주세요.';
    cover.classList.add('failed');
    fail.hidden = false;
  }

  // ---------- 인트로 영상 ----------
  // state: off(틀지 않음) · loading · playing · done(로고 다 그려짐 — 그 장면 그대로) · failed(못 틂 — 검정)
  var intro = { state: 'off', told: false, loadTimer: 0, maxTimer: 0, blobUrl: '' };
  function stopIntro() {
    clearTimeout(intro.loadTimer); clearTimeout(intro.maxTimer);
    try { video.pause(); } catch (e) {}
  }
  function introFailed() {
    if (intro.state !== 'loading' && intro.state !== 'playing') return;
    intro.state = 'failed';
    stopIntro();
    video.classList.remove('on');               // 검정 화면 (로고 움직임 없음)
    tryFinish();
  }
  function introEnded() {
    if (intro.state !== 'playing') return;
    intro.state = 'done';                       // 다 그려진 로고 장면에서 멈춘 채 앱을 기다림
    stopIntro();
    tryFinish();
  }
  /** 로고가 다 그려졌으면 거기서 멈춤 (그 뒤는 같은 장면 — 영상 끝을 기다리지 않음) */
  function logoDone() {
    if (intro.state === 'playing' && video.currentTime >= INTRO_LOGO_DONE) introEnded();
  }
  /** 화면이 바뀔 때마다 확인 (되는 브라우저만 — 나머지는 timeupdate, 늦어도 0.25초) */
  function watchFrames() {
    if (intro.state !== 'playing' || typeof video.requestVideoFrameCallback !== 'function') return;
    video.requestVideoFrameCallback(function () { logoDone(); watchFrames(); });
  }
  /** 영상 주소: 서비스 워커가 저장해 둔 통째 파일(blob) — 없거나 0.4초 안에 못 꺼내면 인터넷 주소 */
  function introSource(done) {
    var sent = false;
    var give = function (src) { if (!sent) { sent = true; done(src); } };
    if (!window.caches || !window.URL || !URL.createObjectURL) { give(INTRO_SRC); return; }
    setTimeout(function () { give(INTRO_SRC); }, 400);
    try {
      caches.match(INTRO_SRC)
        .then(function (res) { return res && res.ok ? res.blob() : null; })
        .then(function (blob) {
          if (!blob || !blob.size || sent) { give(INTRO_SRC); return; }
          intro.blobUrl = URL.createObjectURL(blob.type ? blob : new Blob([blob], { type: 'video/mp4' }));
          give(intro.blobUrl);
        })
        .catch(function () { give(INTRO_SRC); });
    } catch (e) { give(INTRO_SRC); }
  }
  function startIntro() {
    intro.state = 'loading';
    video.addEventListener('playing', function () {
      if (intro.state !== 'loading') return;
      intro.state = 'playing';
      clearTimeout(intro.loadTimer);
      video.classList.add('on');
      intro.maxTimer = setTimeout(introEnded, INTRO_MAX_MS);
      watchFrames();
    });
    video.addEventListener('timeupdate', logoDone);
    video.addEventListener('ended', introEnded);
    video.addEventListener('error', introFailed);
    intro.loadTimer = setTimeout(introFailed, INTRO_LOAD_MS);
    video.preload = 'auto';
    introSource(function (src) {
      if (intro.state !== 'loading') return;   // 그사이 앱이 먼저 준비돼 영상을 생략함
      video.src = src;
      try {
        var p = video.play();
        // 자동재생이 막힌 기기(저전력 모드 등)는 검정 화면
        if (p && p.catch) p.catch(introFailed);
      } catch (e) { introFailed(); }
    });
  }
  // 인트로는 앱이 감싸기에 맡긴다고 한 적이 있을 때만 · 하루 한 번
  var ownIntro = lsGet(KEY_APP_INTRO) === '1';
  if (ownIntro && lsGet(KEY_INTRO_DATE) !== today()) {
    lsSet(KEY_INTRO_DATE, today());
    startIntro();
  }

  /** 영상 마지막 장면의 로고 자리 (앱 틀 기준 px) — 앱 TAIntro.videoLogoRect 와 같은 계산 */
  function logoRect() {
    try {
      var r = video.getBoundingClientRect(), f = frame.getBoundingClientRect();
      if (!(r.width > 0 && r.height > 0)) return null;
      var scale = Math.max(r.width / INTRO_W, r.height / INTRO_H);
      var w = INTRO_W * scale, h = INTRO_H * scale;
      var left = r.left + (r.width - w) / 2 - f.left, top = r.top + (r.height - h) / 2 - f.top;
      var round = function (n) { return Math.round(n * 100) / 100; };
      return { left: round(left + INTRO_LOGO.x * w), top: round(top + INTRO_LOGO.y * h), width: round(INTRO_LOGO.w * w), height: round(INTRO_LOGO.h * h) };
    } catch (e) { return null; }
  }

  // ---------- 앱 준비 ----------
  function markReady() {
    if (appReady) return;
    appReady = true;
    clearTimeout(readyTimer);
    tryFinish();
  }
  /** 앱이 준비됐고 영상도 끝났으면 걷음 (새 앱이면 로고를 넘겨줌) */
  function tryFinish() {
    if (revealed || failed || handing || !appReady) return;
    if (intro.state === 'loading') { intro.state = 'failed'; stopIntro(); video.classList.remove('on'); }   // 앱이 먼저 준비됨 → 늦은 영상은 생략
    if (intro.state === 'playing') return;      // 영상이 끝나면 다시 옴
    if (app.intro && intro.told && appWin) {
      handing = true;
      var logo = intro.state === 'done' ? logoRect() : null;
      post({ amuse: 'handoff', logo: logo });
      // 앱이 답하지 않으면 그냥 걷음
      handTimer = setTimeout(function () { reveal(true); }, logo ? 3500 : 1200);
    } else {
      reveal(false);
    }
  }

  // 다른 사이트가 이 페이지를 iframe 으로 감싸면 앱을 띄우지 않음
  if (window.top !== window.self) {
    direct.target = '_top';
    document.getElementById('retry').hidden = true;
    showFail();
    failMsg.textContent = '이 화면은 다른 사이트 안에서 열 수 없어요.';
    return;
  }

  // iframe 의 load 는 구글이 거절(X-Frame-Options)해도 발생함 → 그대로 걷으면 오류 화면(흰색)이 보임.
  // Apps Script 화면은 안쪽에 iframe(sandboxFrame)을 갖고 있으므로, 그 개수(교차 출처에서도 읽을 수 있음)로 성공을 판단.
  // 성공이면: 앱이 인사했으면 'ready' 를 기다리고(최대 6초), 인사가 없으면(예전 앱 · 구글 안내 화면) 잠깐 뒤 걷음
  function frameCount() { try { return frame.contentWindow.length; } catch (e) { return 0; } }
  function loadedOk() {
    if (loaded) return;
    loaded = true;
    clearTimeout(readyTimer);
    // 감싸기가 인트로를 트는 중이면 새 앱이 올 것을 알고 있음 → 인사가 늦어도(느린 폰) 6초까지 기다림 (마지막 장면 유지)
    readyTimer = setTimeout(markReady, (app.hello || intro.state !== 'off') ? 6000 : 1500);
  }
  frame.addEventListener('load', function () {
    if (frameCount() > 0) { loadedOk(); return; }
    var tries = 0;
    clearInterval(pollTimer);
    pollTimer = setInterval(function () {
      if (frameCount() > 0) { clearInterval(pollTimer); loadedOk(); }
      else if (++tries >= 12) { clearInterval(pollTimer); showFail(); }
    }, 250);
  });
  failTimer = setTimeout(showFail, WAIT_MS);
  window.addEventListener('online', function () { if (failed && !revealed) location.reload(); });

  // ---------- 앱과의 메시지 ----------
  /** 앱 틀 기준 안전 영역: 틀이 화면 가장자리에 못 닿은 만큼은 빼고 넘김 (그 띠는 가장자리 색이 메움) */
  function insets() {
    var e = envInsets();
    fit();
    var r = frame.getBoundingClientRect();
    var W = window.innerWidth || r.right, H = Math.max(view.full, r.bottom);
    var cut = function (n) { return Math.max(0, Math.round(n * 100) / 100); };
    return {
      top: cut(e.top - Math.max(0, r.top)),
      right: cut(e.right - Math.max(0, W - r.right)),
      bottom: cut(e.bottom - Math.max(0, H - r.bottom)),
      left: cut(e.left - Math.max(0, r.left))
    };
  }
  function insideFrame(win) {
    try {
      for (var w = win, i = 0; w && i < 8; i++) {
        if (w === frame.contentWindow) return true;
        if (w === w.parent) return false;
        w = w.parent;
      }
    } catch (e) {}
    return false;
  }
  function readStore() {
    var out = {};
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && k.indexOf(STORE_PREFIX) === 0) out[k.slice(STORE_PREFIX.length)] = localStorage.getItem(k);
      }
    } catch (e) {}
    return out;
  }

  var appWin = null, appOrigin = '';
  function post(msg) { if (appWin) { try { appWin.postMessage(msg, appOrigin); } catch (e) {} } }

  window.addEventListener('message', function (e) {
    if (!SANDBOX_ORIGIN.test(e.origin) || !insideFrame(e.source)) return;
    var d = e.data;
    if (!d || typeof d !== 'object' || typeof d.amuse !== 'string') return;

    if (d.amuse === 'hello') {
      appWin = e.source; appOrigin = e.origin;
      if (lsGet(KEY_SANDBOX) !== e.origin) lsSet(KEY_SANDBOX, e.origin);   // 다음에 열 때 미리 연결 (<head>)
      var caps = Array.isArray(d.caps) ? d.caps : [];
      app.hello = true;
      app.v = Number(d.v) || 1;
      app.intro = caps.indexOf('intro') !== -1;
      app.chrome = caps.indexOf('chrome') !== -1;
      // 인트로를 맡을지: 이번에 알아들으면 다음부터 (오늘은 앱이 하던 대로 앱이 틂) · 예전 앱이면 맡지 않음
      if (app.intro && !ownIntro) { lsSet(KEY_APP_INTRO, '1'); lsSet(KEY_INTRO_DATE, today()); }
      if (!app.intro) lsDel(KEY_APP_INTRO);
      if (loaded) { clearTimeout(readyTimer); readyTimer = setTimeout(markReady, 6000); }
      root.classList.add('edge');
      var reply = { amuse: 'wrapper', v: VERSION, insets: insets(), store: readStore(), standalone: standalone };
      if (app.intro && ownIntro) {
        // 감싸기가 인트로를 맡음 → 앱은 자기 인트로를 틀지 않음 · introPlaying 이면 검정 막을 두고 로고 넘겨받기를 기다림
        reply.intro = 'wrapper';
        reply.introPlaying = !revealed && (intro.state === 'loading' || intro.state === 'playing' || intro.state === 'done');
        intro.told = reply.introPlaying;
      }
      lastInsets = JSON.stringify(reply.insets);
      post(reply);
      lastView = '';
      sendView();
    } else if (d.amuse === 'ready') {
      markReady();
    } else if (d.amuse === 'handoff') {
      if (handing) reveal(true);
    } else if (d.amuse === 'chrome') {
      if (typeof d.top === 'string' && typeof d.bottom === 'string' && HEX.test(d.top) && HEX.test(d.bottom)) {
        fillApp = { top: d.top.toLowerCase(), bottom: d.bottom.toLowerCase() };
        if (revealed) appFill();              // 여는 동안은 검정 그대로
      }
    } else if (d.amuse === 'set' && typeof d.key === 'string' && /^[\w.-]{1,64}$/.test(d.key)) {
      try {
        if (d.value === null || d.value === undefined) localStorage.removeItem(STORE_PREFIX + d.key);
        else if (typeof d.value === 'string' && d.value.length <= 65536) localStorage.setItem(STORE_PREFIX + d.key, d.value);
      } catch (err) {}
    }
  });

  var lastInsets = '';
  function sendInsets() {
    if (!appWin) { fit(); return; }
    var v = insets(), s = JSON.stringify(v);
    if (s !== lastInsets) { lastInsets = s; post({ amuse: 'insets', insets: v }); }
  }
  window.addEventListener('resize', sendInsets);
  window.addEventListener('orientationchange', function () { setTimeout(sendInsets, 300); });
  // 아이폰은 홈 화면 앱을 막 열었을 때 크기를 늦게 알려 주기도 함 → 잠깐 뒤 한 번 더
  setTimeout(sendInsets, 600);
  setTimeout(sendInsets, 2000);

  // 보이는 높이 · 위 위치 (키보드) — 바뀔 때만 보냄
  var lastView = '';
  function sendView() {
    if (!appWin) return;
    var vv = window.visualViewport;
    var h = vv ? vv.height : window.innerHeight, top = vv ? vv.offsetTop : 0;
    if (!(h > 0)) return;
    // 틀을 화면 끝까지 늘렸으면(아이폰 홈 화면 앱) 키보드가 없을 때는 늘린 높이를 보이는 높이로 넘김
    //  (창 높이 그대로 넘기면 앱이 키보드가 열린 줄 알고 로그인 화면을 줄여 맞춤)
    if (view.full > view.base && h >= view.base - 1) h += view.full - view.base;
    var v = { amuse: 'vv', h: Math.round(h), top: Math.max(0, Math.round(top || 0)) };
    var s = v.h + ',' + v.top;
    if (s !== lastView) { lastView = s; post(v); }
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', sendView);
    window.visualViewport.addEventListener('scroll', sendView);
  }
  window.addEventListener('resize', sendView);

  // ---------- ?debug=1 : 크기 · 안전 영역 ----------
  if (DEBUG) {
    var dbg = document.createElement('pre');
    dbg.id = 'debug';
    document.body.appendChild(dbg);
    var px = function (n) { return Math.round(n * 10) / 10; };
    setInterval(function () {
      var r = frame.getBoundingClientRect(), e = envInsets(), vv = window.visualViewport, cs = getComputedStyle(root);
      dbg.textContent = [
        'wrap v' + VERSION + '  edge=' + root.classList.contains('edge') + '  standalone=' + standalone + ' ios=' + iosStandalone,
        'app hello=' + app.hello + ' v' + app.v + ' intro=' + app.intro + ' chrome=' + app.chrome + '  ready=' + appReady,
        'env t' + px(e.top) + ' b' + px(e.bottom) + ' l' + px(e.left) + ' r' + px(e.right) + '  sent ' + (lastInsets || '-'),
        'inner ' + window.innerWidth + 'x' + window.innerHeight + '  client ' + root.clientWidth + 'x' + root.clientHeight +
          '  outer ' + window.outerWidth + 'x' + window.outerHeight,
        'screen ' + (window.screen ? screen.width + 'x' + screen.height : '-') + '  lvh ' + px(view.lvh) + '  full ' + px(view.full) +
          ' (base ' + px(view.base) + ')  --full-h ' + (cs.getPropertyValue('--full-h').trim() || '-'),
        'vv ' + (vv ? px(vv.width) + 'x' + px(vv.height) + ' @' + px(vv.offsetTop) : '-') + '  dpr ' + (window.devicePixelRatio || 1),
        'iframe ' + px(r.left) + ',' + px(r.top) + ' ' + px(r.width) + 'x' + px(r.height) + ' (bottom ' + px(r.bottom) + ')',
        'fill ' + cs.getPropertyValue('--fill-top').trim() + ' / ' + cs.getPropertyValue('--fill-bot').trim() +
          '  intro ' + intro.state + (intro.told ? ' told' : '') + (ownIntro ? ' own' : '') + '  cover ' + (revealed ? 'gone' : failed ? 'fail' : 'on')
      ].join('\n');
    }, 500);
  }

  // ---------- 앱 열기 ----------
  frame.src = FRAME_URL;

  // ---------- 서비스 워커 (Android 의 '앱 설치' + 오프라인일 때 로딩 화면) ----------
  if ('serviceWorker' in navigator &&
      (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    navigator.serviceWorker.register('sw.js', { scope: './' }).catch(function () {});
  }
})();
</script>
</body>
</html>
